# Package the card and publish it — only when asked.
#
# Actions → Release → Run workflow, give it a version. It runs the tests, stamps
# that version into the card, commits it, and publishes the release. Nothing
# happens on a push.
#
# HACS takes the files from `dist` at the release tag, so there is nothing to
# attach: the card, its translations and its images all sit there flat.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.1.0-beta"
        required: true
      prerelease:
        description: "Mark as a pre-release"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test
        run: |
          npm install --no-audit --no-fund
          npm test

      - name: Stamp the version into the card
        run: |
          sed -i "s/^const VERSION = \".*\";/const VERSION = \"${{ inputs.version }}\";/" \
            dist/eufy-camera-card.js
          grep -n '^const VERSION' dist/eufy-camera-card.js

      - name: Keep the stamped version in the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: ${{ inputs.version }}" || echo "already at this version"
          git push

      - name: Publish
        # No attached archive: HACS's validator rejects a zip for a plugin even
        # though its installer would accept one (hacs/integration#4928). It takes
        # the files from `dist` at the tag instead, which is why everything the
        # card needs sits there flat, next to the .js.
        run: |
          flags=""
          if [ "${{ inputs.prerelease }}" = "true" ]; then flags="--prerelease"; fi
          gh release create "${{ inputs.version }}" \
            --title "${{ inputs.version }}" $flags --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
