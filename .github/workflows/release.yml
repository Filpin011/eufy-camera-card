# Package the card and publish it — only when asked.
#
# Actions → Release → Run workflow, give it a version. It runs the tests, checks
# the card already carries that version, and publishes the release. Nothing
# happens on a push.
#
# Bump VERSION in dist/eufy-camera-card.js first and merge it: main is protected,
# so this cannot write to the repository — only read it and tag it.
#
# HACS takes the files from `dist` at the release tag, so there is nothing to
# attach: the card, its translations and its images all sit there flat.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.1.0-beta"
        required: true
      prerelease:
        description: "Mark as a pre-release"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test
        run: |
          npm install --no-audit --no-fund
          npm test

      - name: Check the card carries this version
        # It verifies rather than writes: `main` is protected, so a workflow
        # cannot push to it, and a release that quietly disagreed with the file
        # would be worse than one that refuses to start. Bump VERSION in the card,
        # merge it, then run this.
        run: |
          want='${{ inputs.version }}'
          have=$(sed -n 's/^const VERSION = "\(.*\)";/\1/p' dist/eufy-camera-card.js)
          if [ "$have" != "$want" ]; then
            echo "::error::dist/eufy-camera-card.js says VERSION \"$have\", you asked to release \"$want\"."
            echo "::error::Update VERSION in the card, merge that, then run this again."
            exit 1
          fi
          echo "card and release agree on $want"

      - name: Publish
        # No attached archive: HACS's validator rejects a zip for a plugin even
        # though its installer would accept one (hacs/integration#4928). It takes
        # the files from `dist` at the tag instead, which is why everything the
        # card needs sits there flat, next to the .js.
        run: |
          flags=""
          if [ "${{ inputs.prerelease }}" = "true" ]; then flags="--prerelease"; fi
          gh release create "${{ inputs.version }}" \
            --title "${{ inputs.version }}" $flags --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
